<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe7d3">
  <title>Laumijos žurnalas · Rėdos ratas</title>
  <link rel="stylesheet" href="styles-v2.css?v=6">
  <script src="/laumija-app/analytics.js?v=1" defer></script>
<style>.laumija-service-nav{display:none}body.embed-mode{min-height:0}.embed-mode main{padding-bottom:12px}.embed-mode .reader{padding-bottom:0}.embed-mode .page-shell{min-height:0}.embed-mode .laumija-service-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:14px 14px 0;padding:7px;border:1px solid var(--line);border-radius:18px;background:#d7d0be}.laumija-service-nav a{display:flex;align-items:center;justify-content:center;min-height:44px;padding:7px 4px;border-radius:12px;background:#eee7d5;color:var(--ink);text-decoration:none;text-align:center;font:12px/1.25 Georgia,serif}.laumija-service-nav a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}</style>
</head>
<body>
  <header class="topbar">
    <a class="back-link" href="https://laumija.lt" aria-label="Grįžti į Laumiją">← Laumija</a>
    <div class="brand">
      <span>RĖDOS RATO ŽURNALAS</span>
      <strong id="cycle-label">Austėjos laikas</strong>
    </div>
    <button class="menu-toggle" type="button" aria-label="Atverti žurnalo meniu" aria-expanded="false">
      <span aria-hidden="true">☰</span>
    </button>
  </header>

  <nav class="slide-menu" aria-label="Žurnalo nuorodos">
    <a id="austeja-book" href="https://zivilesau.github.io/laumija-app/" target="_blank" rel="noopener">
      <span class="menu-icon" aria-hidden="true">📖</span>
      <span>Austėjos knyga</span>
    </a>
    <a id="medeina-book" href="https://zivilesau.github.io/laumija-app/medeina-perziura.html" target="_blank" rel="noopener">
      <span class="menu-icon" aria-hidden="true">🌲</span>
      <span>Medeinos e. knyga</span>
    </a>
    <button type="button" id="open-supplements">
      <span class="menu-icon" aria-hidden="true">✦</span>
      <span>Priedai</span>
    </button>
    <a href="../medeina-kortos.html?v=draw7">
      <span class="menu-icon" aria-hidden="true">🃏</span>
      <span>Medeinos kortos</span>
    </a>
  </nav>

  <main>
    <section class="prelaunch" id="prelaunch" hidden>
      <div class="prelaunch-ornament">✦</div>
      <p class="eyebrow">Jau netrukus</p>
      <h1>Austėjos laikas</h1>
      <p>Pirmasis žurnalo puslapis atsivers rugpjūčio 1 dieną.</p>
      <div class="countdown" id="countdown"></div>
    </section>

    <section class="reader" id="reader" aria-label="Rėdos rato savaičių žurnalas">
      <div class="page-shell">
        <div class="loading" id="loading">Kraunamas žurnalas…</div>
        <img id="week-image" alt="">
      </div>
      <div class="controls">
        <button class="arrow" id="prev-week" type="button" aria-label="Ankstesnė savaitė">‹</button>
        <div class="page-info">
          <strong id="week-title"></strong>
          <span id="week-count"></span>
        </div>
        <button class="arrow" id="next-week" type="button" aria-label="Kita savaitė">›</button>
      </div>
      <p class="release-note" id="release-note"></p>
<nav class="laumija-service-nav" aria-label="Apie Laumiją, tavo kambarys ir registracija vizitui"><a href="https://zivilesau.github.io/laumija-app/laumes-namai/?v=3" target="_top">Apie<br>Laumiją</a><a href="https://zivilesau.github.io/laumija-app/zurnalas/tavo-kambarys.html" target="_top">Tavo<br>kambarys</a><a href="https://laumija.setmore.com/" target="_top">Registracija<br>vizitui</a></nav>
    </section>
  </main>

  <dialog class="supplements" id="supplements">
    <div class="dialog-top">
      <div>
        <span class="eyebrow" id="supplement-cycle">Austėjos laikas</span>
        <strong>Priedai</strong>
      </div>
      <button type="button" id="close-supplements" aria-label="Uždaryti priedus">×</button>
    </div>
    <div class="supplement-page">
      <img id="supplement-image" alt="">
    </div>
    <div class="controls">
      <button class="arrow" id="prev-supplement" type="button" aria-label="Ankstesnis priedas">‹</button>
      <div class="page-info">
        <strong id="supplement-title"></strong>
        <span id="supplement-count"></span>
      </div>
      <button class="arrow" id="next-supplement" type="button" aria-label="Kitas priedas">›</button>
    </div>
  </dialog>

  <script src="script.js?v=6"></script>
<script>if(document.body.classList.contains('embed-mode')){const main=document.querySelector('main');let lastHeight=0;const reportHeight=()=>{const height=Math.ceil(main.getBoundingClientRect().bottom+window.scrollY);if(height===lastHeight)return;lastHeight=height;window.parent.postMessage({type:'laumija-journal-height',height},'https://laumija.lt')};new ResizeObserver(reportHeight).observe(main);window.addEventListener('load',reportHeight);reportHeight()}</script>
</body>
</html>
