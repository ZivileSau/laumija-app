<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#efe8dc">
  <meta name="description" content="Laumijos mėnulio dienų kalendorius">
  <title>Laumijos mėnulio dienos</title>
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <main class="shell">
    <section class="phase-card" aria-label="Dabartinė mėnulio fazė">
      <p class="phase-name" id="phase-name">Skaičiuojama mėnulio fazė…</p>
      <div class="phase-strip" id="phase-strip" aria-hidden="true"></div>
    </section>

    <section class="today-card" aria-label="Šiandienos deivės fazė ir refleksija">
      <div class="deity-phase">
        <img id="deity-phase-image" alt="">
      </div>
      <div class="today-copy">
        <button id="open-today" type="button">Dienos refleksija</button>
      </div>
    </section>

    <section class="calendar" aria-labelledby="calendar-title">
      <div class="section-heading">
        <p class="eyebrow">Visas ciklas</p>
        <h2 id="calendar-title">Pasirink dieną</h2>
      </div>
      <div class="day-grid" id="day-grid"></div>
    </section>

    <article class="reading" id="reading" aria-live="polite" tabindex="-1">
      <button class="close-reading" id="close-reading" type="button" aria-label="Uždaryti tekstą">×</button>
      <p class="reading-day" id="reading-day"></p>
      <h2 id="reading-title"></h2>
      <div id="reading-body"></div>
    </article>
  </main>
  <script src="app.js?v=4"></script>
</body>
</html>
