<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medeinos archetipų kortos</title><style>:root{--ink:#283126;--paper:#fff8ef}*{box-sizing:border-box}body{margin:0;background:#e8e1d4;color:var(--ink);font:16px/1.6 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:20px 14px 50px}h1{margin:0 0 16px;font-size:25px}button{border:0;border-radius:999px;padding:12px 20px;background:#304b36;color:#fff;font:inherit;font-weight:700;cursor:pointer}.grid{display:grid;gap:22px;margin-top:24px}.card[hidden]{display:none}.card{background:var(--paper);border-radius:20px;overflow:hidden;box-shadow:0 8px 28px #0002}.body{padding:18px}.card h2{margin:0;font-size:24px}@media(max-width:600px){main{padding:16px 12px 28px}h1{font-size:21px;line-height:1.2;margin-bottom:14px}button{padding:10px 17px;font-size:14px}.grid{margin-top:18px}.body{padding:16px 18px}.card h2{font-size:20px}}</style></head><body><main><h1>🌲 Medeinos archetipų kortos</h1><button id="draw-card" type="button">Traukti kortą</button><p id="draw-status" aria-live="polite"></p><section class="grid"><article class="card" hidden><div class="body"><h2>Medeinos korta</h2></div></article><article class="card" hidden><div class="body"><h2>Šnabždesys</h2></div></article><article class="card" hidden><div class="body"><h2>Basos pėdos</h2></div></article><article class="card" hidden><div class="body"><h2>Instinktas</h2></div></article><article class="card" hidden><div class="body"><h2>Ribos</h2></div></article><article class="card" hidden><div class="body"><h2>Šaknų giesmė</h2></div></article><article class="card" hidden><div class="body"><h2>Tamsa</h2></div></article><article class="card" hidden><div class="body"><h2>Vilkė</h2></div></article><article class="card" hidden><div class="body"><h2>Grybų karalystė</h2></div></article><article class="card" hidden><div class="body"><h2>Miško tyla</h2></div></article><article class="card" hidden><div class="body"><h2>Paleidimas</h2></div></article><article class="card" hidden><div class="body"><h2>Gintarinė ugnis</h2></div></article></section></main><script>const cards=[...document.querySelectorAll(".card")];const button=document.querySelector("#draw-card");const status=document.querySelector("#draw-status");button.addEventListener("click",()=>{const chosen=Math.floor(Math.random()*cards.length);cards.forEach((card,index)=>{card.hidden=index!==chosen;card.style.display=index===chosen?"block":"none"});status.textContent=`Tavo korta: ${cards[chosen].querySelector("h2").textContent}`;button.textContent="Traukti kitą kortą";window.scrollTo({top:0,behavior:"smooth"})});</script></body></html>
