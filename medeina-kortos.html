<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medeinos archetipų kortos</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e1d4;color:#283126;font:16px/1.6 system-ui,sans-serif}main{width:min(100%,760px);min-height:100vh;min-height:100dvh;margin:auto;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center}.start{width:min(100%,calc(100dvh - 24px));aspect-ratio:1;background:url("medeina-assets/start.png") center/cover no-repeat;border-radius:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px #0003}.start[hidden],.card[hidden]{display:none}.grid{display:grid;width:100%;order:2}.card img{display:block;width:100%;height:auto;border-radius:22px;box-shadow:0 8px 28px #0003}button{border:1px solid #d8bd74;border-radius:999px;padding:12px 22px;background:#304b36;color:#fff;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 5px 18px #0005}button.has-card{order:3;margin:16px auto 0}@media(max-width:600px){main{padding:8px}.start{width:100%;border-radius:16px}.card img{border-radius:16px}button{padding:10px 18px;font-size:14px}}</style></head><body><main><section class="start" id="start-screen"><button id="draw-card" type="button">Traukti kortą</button></section><section class="grid"><article class="card" hidden><img src="medeina-assets/card-01.png" alt="Medeinos korta 1"></article><article class="card" hidden><img src="medeina-assets/card-02.png" alt="Medeinos korta 2"></article><article class="card" hidden><img src="medeina-assets/card-03.png" alt="Medeinos korta 3"></article><article class="card" hidden><img src="medeina-assets/card-04.png" alt="Medeinos korta 4"></article><article class="card" hidden><img src="medeina-assets/card-05.png" alt="Medeinos korta 5"></article><article class="card" hidden><img src="medeina-assets/card-06.png" alt="Medeinos korta 6"></article><article class="card" hidden><img src="medeina-assets/card-07.png" alt="Medeinos korta 7"></article><article class="card" hidden><img src="medeina-assets/card-08.png" alt="Medeinos korta 8"></article><article class="card" hidden><img src="medeina-assets/card-09.png" alt="Medeinos korta 9"></article><article class="card" hidden><img src="medeina-assets/card-10.png" alt="Medeinos korta 10"></article><article class="card" hidden><img src="medeina-assets/card-11.png" alt="Medeinos korta 11"></article><article class="card" hidden><img src="medeina-assets/card-12.png" alt="Medeinos korta 12"></article></section></main><script>const cards=[...document.querySelectorAll(".card")],button=document.querySelector("#draw-card"),start=document.querySelector("#start-screen"),main=document.querySelector("main");button.addEventListener("click",()=>{const chosen=Math.floor(Math.random()*cards.length);cards.forEach((card,index)=>{card.hidden=index!==chosen});start.hidden=true;main.appendChild(button);button.classList.add("has-card");button.textContent="Traukti kitą kortą"});</script></body></html>
